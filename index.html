<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock Carol Ngwenya</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">Live · Local Time</div>
    <h1>World Clock</h1>
    <div class="sub" id="utc-line">—</div>
  </header>

  <label for="location-select">Choose a location:</label>
  <select id="location-select">
    <option value="Africa/Johannesburg">Johannesburg</option>
    <option value="Europe/London">London</option>
    <option value="America/New_York">New York</option>
    <option value="America/Sao_Paulo">São Paulo</option>
    <option value="Asia/Dubai">Dubai</option>
    <option value="Asia/Kolkata">Mumbai</option>
    <option value="Asia/Singapore">Singapore</option>
    <option value="Asia/Tokyo">Tokyo</option>
    <option value="Australia/Sydney">Sydney</option>
    <option value="America/Los_Angeles">Los Angeles</option>
  </select>

  <p id="clock"></p>
  <a href="#" id="home-link" class="home-link">← Back to your location</a>

  <div class="grid" id="grid"></div>
</main>
<footer>
  This project was coded by Carol Ngwenya and is open sourced on
  <a href="https://github.com/CarolNgwe24" target="_blank" rel="noopener">GitHub</a>
</footer>
<script src="index.js"></script>
</body>
</html>
